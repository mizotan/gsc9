<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Splash — 盆栽企画</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 2s linear;
      cursor: pointer;
    }
    #splash.is-fade {
      opacity: 0;
      pointer-events: none;
    }
    #splash.is-gone {
      display: none;
    }
    #splash img {
      width: 180px;
      height: auto;
      display: block;
      pointer-events: none;
    }
    /* 確認用：スプラッシュ後に見えるダミーTOP */
    #dummyTop {
      display: none;
      color: #00ff88;
      font-family: sans-serif;
      text-align: center;
      padding-top: 40vh;
    }
    #dummyTop.show { display: block; }
  </style>
</head>
<body>
  <div id="splash" title="タップでスキップ">
    <img src="rogo.png" alt="盆栽企画 presents" width="180">
  </div>

  <div id="dummyTop">TOP（ダミー）</div>

  <script>
    const splash = document.getElementById('splash');
    const dummyTop = document.getElementById('dummyTop');
    let closed = false;
    let fadeTimer = null;
    let endTimer = null;

    function closeSplash() {
      if (closed) return;
      closed = true;
      clearTimeout(fadeTimer);
      clearTimeout(endTimer);
      splash.classList.add('is-fade');
      // フェード途中スキップ時も短く消す
      const done = () => {
        splash.classList.add('is-gone');
        dummyTop.classList.add('show');
      };
      // すでにフェード中なら残り時間を待たず、transitionend か短い遅延
      const onEnd = () => {
        splash.removeEventListener('transitionend', onEnd);
        done();
      };
      splash.addEventListener('transitionend', onEnd);
      // transition が動かない場合の保険
      setTimeout(done, 2100);
    }

    // 1秒キープ → 2秒かけてフェード → 完了で非表示
    fadeTimer = setTimeout(() => {
      if (closed) return;
      splash.classList.add('is-fade');
    }, 1000);

    endTimer = setTimeout(() => {
      if (closed) return;
      closed = true;
      splash.classList.add('is-gone');
      dummyTop.classList.add('show');
    }, 3000);

    // タップ／クリックでスキップ
    splash.addEventListener('click', closeSplash);
    splash.addEventListener('touchend', (e) => {
      e.preventDefault();
      closeSplash();
    }, { passive: false });
  </script>
</body>
</html>
